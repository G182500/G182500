<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="Trajetória profissional na Synvia: Estágio (set/2022) → Jr. (abr/2024) → Pleno (fev/2026)">
  <defs>
    <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="460" fill="#0d1117" rx="12"/>

  <text x="450" y="42" fill="#e6edf3" text-anchor="middle" font-size="20" font-weight="700">$ experience &#183; Synvia</text>
  <text x="450" y="64" fill="#7d8590" text-anchor="middle" font-size="12">trajetória contínua na mesma empresa desde 2022</text>

  <g stroke="#21262d" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="360" x2="850" y2="360"/>
    <line x1="100" y1="245" x2="850" y2="245"/>
    <line x1="100" y1="130" x2="850" y2="130"/>
  </g>

  <g fill="#7d8590" font-size="13" text-anchor="end" font-weight="500">
    <text x="92" y="365">Estágio</text>
    <text x="92" y="250">Jr.</text>
    <text x="92" y="135">Pleno</text>
  </g>

  <line x1="100" y1="360" x2="850" y2="360" stroke="#30363d" stroke-width="2"/>

  <path d="M 180 360 L 475 245 L 770 130 L 770 360 L 180 360 Z" fill="url(#areaGrad)"/>

  <path d="M 180 360 L 475 245 L 770 130" stroke="#22C55E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <g>
    <circle cx="180" cy="360" r="14" fill="#22C55E" opacity="0.22"/>
    <circle cx="180" cy="360" r="6.5" fill="#22C55E" stroke="#0d1117" stroke-width="2.5"/>

    <circle cx="475" cy="245" r="14" fill="#22C55E" opacity="0.22"/>
    <circle cx="475" cy="245" r="6.5" fill="#22C55E" stroke="#0d1117" stroke-width="2.5"/>

    <circle cx="770" cy="130" r="16" fill="#22C55E" opacity="0.28"/>
    <circle cx="770" cy="130" r="7" fill="#22C55E" stroke="#0d1117" stroke-width="2.5"/>
  </g>

  <g fill="#7d8590" font-size="12" text-anchor="middle">
    <text x="180" y="390">set/2022</text>
    <text x="475" y="390">abr/2024</text>
    <text x="770" y="390">fev/2026</text>
  </g>

  <g font-size="11" text-anchor="middle" fill="#e6edf3" font-weight="500">
    <text x="180" y="412">Estágio em T.I.</text>
    <text x="475" y="412">Full Stack Jr.</text>
    <text x="770" y="412">Full Stack Pleno</text>
  </g>

  <g>
    <rect x="788" y="100" width="64" height="22" rx="11" fill="#22C55E"/>
    <text x="820" y="115" fill="#ffffff" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.5">ATUAL</text>
  </g>
</svg>
